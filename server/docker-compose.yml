services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - cmd/server/.env
    # The .env file targets a server running on the host; inside compose the services are reached by name.
    environment:
      APP_HTTP_SERVER: ":3000"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KEYCLOAK_URL: http://keycloak:8080/auth
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    networks:
      - app-network

  migrate:
    image: arigaio/atlas:1.3.0
    command:
      - migrate
      - apply
      - --dir
      - file:///migrations
      - --url
      - postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    volumes:
      - ./cmd/migrations/sql:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - cmd/server/.env
    # Imports deploy/keycloak/realm.json when the realm does not exist yet (fresh data, or after
    # `make reset-data`). ${...} placeholders in it are filled from cmd/server/.env.
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    networks:
      - app-network

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - cmd/server/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
    networks:
      - app-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  keycloak_data:

networks:
  app-network:
    driver: bridge
