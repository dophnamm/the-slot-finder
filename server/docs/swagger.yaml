        503 AI_NOT_CONFIGURED when the server has no API key for the chosen provider;
        502 AI_UPSTREAM_FAILED when the model service fails.
      parameters:
      - description: Question
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.AskAIRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
