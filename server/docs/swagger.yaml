  /staffing-drafts/{id}/assignments/{assignmentId}/alternatives:
    get:
      description: Members of the demand's program team who hold its expertise at
        the required level and do not cover it yet, with the hours they have free
        over the demand's window, most first. At most DRAFT_ALTERNATIVES_LIMIT. To
        swap, send one remove and one add in the same PATCH of the draft's assignments.
      parameters:
      - description: Draft id
        in: path
        name: id
        required: true
        type: string
      - description: Assignment id
        in: path
        name: assignmentId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/dtos.AlternativeResponse'
                type: array
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "409":
          description: Conflict
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: People who could take over an assignment
      tags:
      - Staffing drafts
  /staffing-drafts/{id}/reject:
