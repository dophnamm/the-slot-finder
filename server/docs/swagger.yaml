    get:
      description: 'Per expertise (the primary skill of the people) and week: capacity,
        baseline load, free hours, confirmed demand the baseline does not cover (unmet_hours),
        incoming projects'' demand weighted by PIPELINE_CONFIDENCE_PERCENT (pipeline_hours),
        the shortfall free capacity cannot take, and an overloaded flag. sustained_overload
        is the first run of SUSTAINED_OVERLOAD_WEEKS or more overloaded weeks. Weeks
        default and are capped like the heatmap''s. A manager gets their teams'' capacity
        and the demand of the programs they may read.'
      parameters:
      - description: First week
        example: 2026-W42
        in: query
        name: from
        type: string
      - description: Last week
        example: 2026-W53
        in: query
        name: to
