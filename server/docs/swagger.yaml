basePath: /api/v1
definitions:
  dtos.AbsenceResponse:
    properties:
      from_date:
        example: "2026-10-19"
        type: string
      hours_per_day:
        example: 8
        type: number
      id:
        type: string
      person_id:
        type: string
      source:
        enum:
        - manual
        - calendar
        example: manual
        type: string
      status:
        example: approved
        type: string
      to_date:
        example: "2026-10-23"
        type: string
      type:
        example: leave
        type: string
    type: object
  dtos.AcceptDraftRequest:
    properties:
      base_version:
        description: BaseVersion is the draft's base_version; a different baseline
          in force gives 409.
        minimum: 0
        type: integer
      confirm_stretch:
        description: ConfirmStretch must be true when the draft has stretch assignments.
        type: boolean
    required:
    - base_version
    type: object
  dtos.AddAssignmentRequest:
    properties:
      allocations:
        items:
          $ref: '#/definitions/dtos.DraftWeekHours'
        maxItems: 104
        type: array
      demand_id:
        type: string
      person_id:
        type: string
    required:
    - demand_id
    - person_id
    type: object
  dtos.AllocationResponse:
    properties:
      hours:
        example: 16
        type: number
      locked:
        type: boolean
      week:
        example: 2026-W42
        type: string
    type: object
  dtos.AssignmentDemandResponse:
    properties:
      expertise:
        example: QA
        type: string
      from_week:
        example: 2026-W48
        type: string
      headcount:
        example: 1
        type: integer
      hours:
        example: 120
        type: number
      id:
        type: string
      min_level:
        example: 3
        type: integer
      phase:
        example: Test
        type: string
      program:
        example: Acme Commerce Platform
        type: string
      program_id:
        type: string
      project:
        example: Checkout Revamp
        type: string
      project_id:
        type: string
      to_week:
        example: 2026-W50
        type: string
    type: object
  dtos.AssignmentResponse:
    properties:
      allocations:
        items:
          $ref: '#/definitions/dtos.AllocationResponse'
        type: array
      by_hand:
        description: ByHand is true when a Planner added the assignment; false when
          the engine proposed it.
        type: boolean
      demand:
        $ref: '#/definitions/dtos.AssignmentDemandResponse'
      id:
        type: string
      kind:
        enum:
        - primary
        - cross_expertise
        - stretch
        type: string
      person:
        $ref: '#/definitions/dtos.PersonRef'
      reason:
        items:
          type: string
        type: array
      total_hours:
        example: 120
        type: number
    type: object
  dtos.AssumptionRequest:
    properties:
      from_date:
        example: "2026-10-26"
        type: string
      hours_per_day:
        example: 8
        maximum: 24
        type: number
      person_id:
        type: string
      project_id:
        type: string
      to_date:
        example: "2026-11-06"
        type: string
      type:
        enum:
        - shift_project
        - add_absence
        type: string
      weeks:
        example: 2
        type: integer
    required:
    - type
    type: object
  dtos.AssumptionResponse:
    properties:
      from_date:
        example: "2026-10-26"
        type: string
      hours_per_day:
        example: 8
        type: number
      person:
        example: Alex Nguyen
        type: string
      person_id:
        type: string
      project:
        example: Checkout Revamp
        type: string
      project_id:
        type: string
      to_date:
        example: "2026-11-06"
        type: string
      type:
        enum:
        - shift_project
        - add_absence
        type: string
      weeks:
        example: 2
        type: integer
    type: object
  dtos.CalendarFeedResponse:
    properties:
      events_found:
        example: 2
        type: integer
      host:
        example: calendar.google.com
        type: string
      last_error:
        example: CALENDAR_FEED_UNREACHABLE
        type: string
      last_synced_at:
        type: string
    type: object
  dtos.ChangeEventResponse:
    properties:
      attempts:
        type: integer
      draft:
        $ref: '#/definitions/dtos.EventDraftResponse'
      id:
        type: string
      last_error:
        type: string
      occurred_at:
        type: string
      payload:
        additionalProperties: {}
        description: Payload depends on the type, e.g. person_name, from_date and
          to_date for absence.
        type: object
      project_ids:
        items:
          type: string
        type: array
      status:
        enum:
        - pending
        - no_impact
        - draft_created
        - failed
        type: string
      type:
        enum:
        - AbsenceAdded
        - AbsenceRemoved
        - PhaseSlipped
        - ProjectSlipped
        type: string
    type: object
  dtos.ConnectCalendarFeedRequest:
    properties:
      url:
        example: https://calendar.google.com/calendar/ical/name%40example.com/private-abc/basic.ics
        maxLength: 2048
        type: string
    required:
    - url
    type: object
  dtos.CreateAbsenceRequest:
    properties:
      from_date:
        example: "2026-10-19"
        type: string
      hours_per_day:
        example: 8
        maximum: 24
        type: number
      status:
        enum:
        - planned
        - approved
        type: string
      to_date:
        example: "2026-10-23"
        type: string
      type:
        enum:
        - leave
        - training
        type: string
    required:
    - from_date
    - to_date
    - type
    type: object
  dtos.CreateHolidayRequest:
    properties:
      from_date:
        example: "2026-12-24"
        type: string
      hours_per_day:
        example: 8
        maximum: 24
        type: number
      to_date:
        example: "2026-12-25"
        type: string
    required:
    - from_date
    - to_date
    type: object
  dtos.CreatePersonRequest:
    properties:
      email:
        maxLength: 320
        type: string
      end_date:
        type: string
      name:
        maxLength: 200
        type: string
      non_project_hours:
        maximum: 80
        minimum: 0
        type: number
      role:
        type: string
      skills:
        items:
          $ref: '#/definitions/dtos.SkillRequest'
        minItems: 1
        type: array
      start_date:
        type: string
      weekly_hours:
        maximum: 80
        type: number
    required:
    - email
    - name
    - role
    - skills
    type: object
  dtos.CreateProgramRequest:
    properties:
      charter_url:
        maxLength: 2000
        type: string
      client:
        maxLength: 200
        type: string
      end_date:
        example: "2026-12-18"
        type: string
      goal:
        maxLength: 2000
        type: string
      lead_id:
        type: string
      name:
        maxLength: 200
        type: string
      objectives:
        items:
          type: string
        maxItems: 20
        type: array
      start_date:
        example: "2026-09-28"
        type: string
    required:
    - client
    - end_date
    - name
    - objectives
    - start_date
    type: object
  dtos.CreateProjectRequest:
    properties:
      deadline:
        example: "2026-12-18"
        type: string
      done_points:
        minimum: 0
        type: number
      lead_id:
        type: string
      name:
        maxLength: 200
        type: string
      priority:
        example: 2
        maximum: 5
        minimum: 1
        type: integer
      scope_points:
        minimum: 0
        type: number
      start_earliest:
        example: "2026-10-12"
        type: string
    required:
    - deadline
    - name
    - start_earliest
    type: object
  dtos.CreateScenarioRequest:
    properties:
      assumptions:
        items:
          $ref: '#/definitions/dtos.AssumptionRequest'
        minItems: 1
        type: array
      name:
        example: Checkout slips two weeks
        maxLength: 120
        type: string
    required:
    - assumptions
    - name
    type: object
  dtos.CurrentUserResponse:
    properties:
      email:
        example: planner@slot-finder.local
        type: string
      id:
        example: 5b0c2b7e-4c1e-4a43-9b8e-0b1f2f6f8a10
        type: string
      name:
        example: Pat Planner
        type: string
      person_id:
        description: PersonID is the user's person record, or null when the account
          has none.
        example: 0192f3a4-0000-7000-8000-0000000000aa
        type: string
      role:
        enum:
        - planner
        - lead
        - specialist
        example: planner
        type: string
      username:
        example: planner
        type: string
    type: object
  dtos.DemandRequest:
    properties:
      expertise_id:
        type: string
      headcount:
        example: 1
        maximum: 20
        minimum: 1
        type: integer
      id:
        type: string
      min_level:
        example: 3
        maximum: 5
        minimum: 1
        type: integer
      phase_id:
        type: string
      profile:
        enum:
        - flat
        type: string
      total_hours:
        example: 120
        maximum: 100000
        type: number
    required:
    - expertise_id
    type: object
  dtos.DemandResponse:
    properties:
      expertise:
        example: QA
        type: string
      expertise_id:
        type: string
      from_week:
        example: 2026-W46
        type: string
      headcount:
        example: 1
        type: integer
      id:
        type: string
      min_level:
        example: 3
        type: integer
      phase_id:
        type: string
      profile:
        example: flat
        type: string
      to_week:
        example: 2026-W51
        type: string
      total_hours:
        example: 120
        type: number
    type: object
  dtos.DraftDemandResponse:
    properties:
      assigned_hours:
        example: 80
        type: number
      expertise:
        example: QA
        type: string
      from_week:
        example: 2026-W48
        type: string
      headcount:
        example: 1
        type: integer
      hours:
        example: 100
        type: number
      id:
        type: string
      min_level:
        example: 3
        type: integer
      phase:
        example: Test
        type: string
      project:
        example: Checkout Revamp
        type: string
      project_id:
        type: string
      to_week:
        example: 2026-W50
        type: string
      unmet_reason:
        description: UnmetReason is the engine's code for hours it could not place
          when it made the draft.
        enum:
        - NO_SKILL
        - LEVEL_TOO_LOW
        - NO_CAPACITY_BEFORE_DEADLINE
        - BLOCKED_BY_LOCKED
        type: string
    type: object
  dtos.DraftProjectResponse:
    properties:
      deadline_week:
        example: 2026-W50
        type: string
      id:
        type: string
      name:
        example: Checkout Revamp
        type: string
      priority:
        example: 1
        type: integer
      program:
        example: Acme Commerce Platform
        type: string
      program_id:
        type: string
      staffed_at:
        type: string
      status:
        example: incoming
        type: string
    type: object
  dtos.DraftResponse:
    properties:
      assignments:
        description: Assignments are those of the covered demand; the rest of the
          baseline is unchanged.
        items:
          $ref: '#/definitions/dtos.AssignmentResponse'
        type: array
      auto:
        description: Auto is true for a re-plan draft that change events created;
          TriggeredBy lists them.
        type: boolean
      base_version:
        description: BaseVersion is the baseline version the draft was built on; send
          it back to accept.
        example: 3
        type: integer
      changes:
        items:
          $ref: '#/definitions/dtos.PlanChangeResponse'
        type: array
      created_at:
        type: string
      current_version:
        description: CurrentVersion is the baseline in force now. Stale is true when
          they differ.
        example: 3
        type: integer
      demands:
        items:
          $ref: '#/definitions/dtos.DraftDemandResponse'
        type: array
      has_stretch:
        type: boolean
      id:
        type: string
      projects:
        items:
          $ref: '#/definitions/dtos.DraftProjectResponse'
        type: array
      published_at:
        type: string
      stale:
        type: boolean
      status:
        enum:
        - draft
        - published
        - rejected
        - superseded
        type: string
      superseded_by:
        description: SupersededBy is the newer version of a re-plan draft that replaced
          this one.
        type: string
      triggered_by:
        items:
          $ref: '#/definitions/dtos.ChangeEventResponse'
        type: array
      weeks:
        example:
        - 2026-W42
        - 2026-W43
        items:
          type: string
        type: array
    type: object
  dtos.DraftWeekHours:
    properties:
      hours:
        example: 16
        maximum: 80
        minimum: 0
        type: number
      week:
        example: 2026-W42
        type: string
    required:
    - week
    type: object
  dtos.EditDraftRequest:
    properties:
      add:
        items:
          $ref: '#/definitions/dtos.AddAssignmentRequest'
        maxItems: 50
        type: array
      remove:
        items:
          type: string
        maxItems: 200
        type: array
      set:
        items:
          $ref: '#/definitions/dtos.SetAllocationRequest'
        maxItems: 500
        type: array
    type: object
  dtos.EventDraftResponse:
    properties:
      id:
        type: string
      status:
        enum:
        - draft
        - published
        - rejected
        - superseded
        type: string
    type: object
  dtos.ExpertiseHoursResponse:
    properties:
      expertise:
        example: QA
        type: string
      expertise_id:
        type: string
      hours:
        example: 8
        type: number
      primary:
        description: Primary is true when it is the person's primary skill.
        type: boolean
    type: object
  dtos.ExpertiseResponse:
    properties:
      id:
        type: string
      name:
        example: QA
        type: string
    type: object
  dtos.ExpertiseStaffingResponse:
    properties:
      budget_hours:
        example: 160
        type: number
      expertise:
        example: QA
        type: string
      expertise_id:
        type: string
      gap_hours:
        example: 40
        type: number
      planned_hours:
        example: 120
        type: number
      staffing_percent:
        example: 75
        type: number
      understaffed:
        type: boolean
    type: object
  dtos.GenerateDraftRequest:
    properties:
      project_ids:
        items:
          type: string
        maxItems: 20
        minItems: 1
        type: array
    required:
    - project_ids
    type: object
  dtos.HealthResponse:
    properties:
      service:
        example: slot-finder
        type: string
      status:
        example: healthy
        type: string
      timestamp:
        example: "2021-01-01T00:00:00Z"
        type: string
      version:
        example: 1.0.0
        type: string
    type: object
  dtos.HeatmapCellResponse:
    properties:
      band:
        enum:
        - unavailable
        - underused
        - healthy
        - near_full
        - overloaded
        type: string
      by_expertise:
        items:
          $ref: '#/definitions/dtos.ExpertiseHoursResponse'
        type: array
      capacity:
        example: 36
        type: number
      load:
        example: 32
        type: number
      tentative:
        description: Tentative marks planned (not yet approved) absence in the week.
        type: boolean
      utilization:
        description: Utilization is load ÷ capacity; null when capacity is 0.
        example: 0.89
        type: number
      week:
        example: 2026-W42
        type: string
    type: object
  dtos.HeatmapResponse:
    properties:
      rows:
        items:
          $ref: '#/definitions/dtos.HeatmapRowResponse'
        type: array
      weeks:
        example:
        - 2026-W42
        - 2026-W43
        items:
          type: string
        type: array
    type: object
  dtos.HeatmapRowResponse:
    properties:
      cells:
        items:
          $ref: '#/definitions/dtos.HeatmapCellResponse'
        type: array
      person:
        $ref: '#/definitions/dtos.PersonRef'
      primary_expertise:
        example: Engineer
        type: string
      primary_expertise_id:
        type: string
    type: object
  dtos.ImportResultResponse:
    properties:
      created:
        example: 12
        type: integer
      skipped:
        example: 5
        type: integer
      updated:
        example: 3
        type: integer
    type: object
  dtos.MemberExpertiseResponse:
    properties:
      expertise:
        example: Engineer
        type: string
      expertise_id:
        type: string
      hours:
        example: 120
        type: number
      kind:
        enum:
        - primary
        - cross_expertise
        - stretch
        example: primary
        type: string
    type: object
  dtos.Meta:
    description: Metadata for pagination
    properties:
      code:
        example: 400
        type: integer
      error_code:
        example: BAD_REQUEST
        type: string
      message:
        example: Request is invalid
        type: string
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 18
        type: integer
    type: object
  dtos.OverloadedPersonResponse:
    properties:
      person:
        $ref: '#/definitions/dtos.PersonRef'
      weeks:
        items:
          $ref: '#/definitions/dtos.OverloadedWeekResponse'
        type: array
    type: object
  dtos.OverloadedWeekResponse:
    properties:
      capacity:
        example: 36
        type: number
      load:
        example: 44
        type: number
      utilization:
        example: 1.22
        type: number
      week:
        example: 2026-W44
        type: string
    type: object
  dtos.PersonRef:
    properties:
      id:
        type: string
      name:
        example: Lee Lead
        type: string
    type: object
  dtos.PersonResponse:
    properties:
      active:
        type: boolean
      email:
        example: alex@slot-finder.local
        type: string
      end_date:
        type: string
      id:
        type: string
      name:
        example: Alex Nguyen
        type: string
      non_project_hours:
        example: 4
        type: number
      role:
        example: specialist
        type: string
      skills:
        items:
          $ref: '#/definitions/dtos.PersonSkillResponse'
        type: array
      start_date:
        example: "2026-01-05"
        type: string
      weekly_hours:
        example: 40
        type: number
    type: object
  dtos.PersonSkillResponse:
    properties:
      expertise:
        example: Engineer
        type: string
      expertise_id:
        type: string
      level:
        example: 4
        type: integer
      primary:
        type: boolean
    type: object
  dtos.PhaseRequest:
    properties:
      end_week:
        example: 2026-W47
        type: string
      id:
        type: string
      name:
        example: Build
        maxLength: 100
        type: string
      start_week:
        example: 2026-W42
        type: string
    required:
    - end_week
    - name
    - start_week
    type: object
  dtos.PhaseResponse:
    properties:
      end_week:
        example: 2026-W47
        type: string
      id:
        type: string
      name:
        example: Build
        type: string
      sequence:
        example: 1
        type: integer
      start_week:
        example: 2026-W42
        type: string
    type: object
  dtos.PlanChangeResponse:
    properties:
      after_hours:
        example: 80
        type: number
      before_hours:
        example: 0
        type: number
      change:
        enum:
        - added
        - removed
        - changed
        type: string
      demand_id:
        type: string
      expertise:
        example: QA
        type: string
      person:
        $ref: '#/definitions/dtos.PersonRef'
      project:
        example: Checkout Revamp
        type: string
    type: object
  dtos.PlanResponse:
    properties:
      assignments:
        items:
          $ref: '#/definitions/dtos.AssignmentResponse'
        type: array
      id:
        type: string
      kind:
        enum:
        - baseline
        - draft
        type: string
      published_at:
        type: string
      status:
        enum:
        - draft
        - published
        - rejected
        - superseded
        type: string
      version:
        example: 3
        type: integer
    type: object
  dtos.ProgramMemberResponse:
    properties:
      expertises:
        items:
          $ref: '#/definitions/dtos.MemberExpertiseResponse'
        type: array
      from_week:
        example: 2026-W44
        type: string
      person:
        $ref: '#/definitions/dtos.PersonRef'
      projects:
        items:
          $ref: '#/definitions/dtos.ProjectRef'
        type: array
      to_week:
        example: 2026-W48
        type: string
      total_hours:
        example: 160
        type: number
    type: object
  dtos.ProgramOverviewResponse:
    properties:
      metrics:
        $ref: '#/definitions/dtos.ProgressResponse'
      program_id:
        type: string
      projects:
        description: Projects is how many projects (not cancelled) the figures sum
          over.
        example: 3
        type: integer
      staffing_by_expertise:
        items:
          $ref: '#/definitions/dtos.ExpertiseStaffingResponse'
        type: array
    type: object
  dtos.ProgramResponse:
    properties:
      charter_url:
        type: string
      client:
        example: Acme
        type: string
      end_date:
        example: "2026-12-18"
        type: string
      end_week:
        example: 2026-W51
        type: string
      goal:
        type: string
      id:
        type: string
      lead:
        $ref: '#/definitions/dtos.PersonRef'
      name:
        example: Acme onboarding
        type: string
      objectives:
        items:
          type: string
        type: array
      start_date:
        example: "2026-09-28"
        type: string
      start_week:
        example: 2026-W40
        type: string
      status:
        enum:
        - open
        - pending
        - closing
        - closed
        - cancelled
        example: open
        type: string
    type: object
  dtos.ProgressResponse:
    properties:
      actual_hours:
        description: ActualHours and BurnPercent are null until timesheets recorded
          actual hours.
        example: 100
        type: number
      at_risk:
        type: boolean
      behind_on_delivery:
        type: boolean
      budget_hours:
        example: 400
        type: number
      burn_percent:
        example: 25
        type: number
      forecast_hours:
        example: 320
        type: number
      gap_hours:
        example: 80
        type: number
      over_planned:
        type: boolean
      past_end:
        type: boolean
      planned_burn_percent:
        example: 30
        type: number
      planned_hours:
        example: 320
        type: number
      planned_to_date_hours:
        example: 120
        type: number
      scope_percent:
        example: 30
        type: number
      staffing_percent:
        example: 80
        type: number
      time_percent:
        example: 49.5
        type: number
      understaffed:
        type: boolean
    type: object
  dtos.ProjectDetailResponse:
    properties:
      at_risk:
        type: boolean
      created_at:
        type: string
      current_phase:
        $ref: '#/definitions/dtos.PhaseResponse'
      deadline:
        example: "2026-12-18"
        type: string
      deadline_week:
        example: 2026-W51
        type: string
      demands:
        items:
          $ref: '#/definitions/dtos.DemandResponse'
        type: array
      done_points:
        type: number
      id:
        type: string
      lead:
        $ref: '#/definitions/dtos.PersonRef'
      metrics:
        allOf:
        - $ref: '#/definitions/dtos.ProgressResponse'
        description: 'Metrics is set on a program''s project list: Time, Scope, Planned
          burn and Staffing.'
      name:
        example: Mobile app
        type: string
      phases:
        items:
          $ref: '#/definitions/dtos.PhaseResponse'
        type: array
      priority:
        example: 2
        type: integer
      program_id:
        type: string
      program_lead:
        $ref: '#/definitions/dtos.PersonRef'
      program_name:
        example: Acme onboarding
        type: string
      scope_points:
        type: number
      staffed_at:
        description: StaffedAt is when an accepted staffing draft first covered the
          whole project.
        type: string
      start_earliest:
        example: "2026-10-12"
        type: string
      start_week:
        example: 2026-W42
        type: string
      status:
        enum:
        - incoming
        - planned
        - active
        - on_hold
        - done
        - cancelled
        example: incoming
        type: string
    type: object
  dtos.ProjectRef:
    properties:
      id:
        type: string
      name:
        example: Checkout Revamp
        type: string
    type: object
  dtos.ProjectResponse:
    properties:
      at_risk:
        type: boolean
      created_at:
        type: string
      current_phase:
        $ref: '#/definitions/dtos.PhaseResponse'
      deadline:
        example: "2026-12-18"
        type: string
      deadline_week:
        example: 2026-W51
        type: string
      done_points:
        type: number
      id:
        type: string
      lead:
        $ref: '#/definitions/dtos.PersonRef'
      metrics:
        allOf:
        - $ref: '#/definitions/dtos.ProgressResponse'
        description: 'Metrics is set on a program''s project list: Time, Scope, Planned
          burn and Staffing.'
      name:
        example: Mobile app
        type: string
      priority:
        example: 2
        type: integer
      program_id:
        type: string
      program_name:
        example: Acme onboarding
        type: string
      scope_points:
        type: number
      staffed_at:
        description: StaffedAt is when an accepted staffing draft first covered the
          whole project.
        type: string
      start_earliest:
        example: "2026-10-12"
        type: string
      start_week:
        example: 2026-W42
        type: string
      status:
        enum:
        - incoming
        - planned
        - active
        - on_hold
        - done
        - cancelled
        example: incoming
        type: string
    type: object
  dtos.ReplaceDemandsRequest:
    properties:
      demands:
        items:
          $ref: '#/definitions/dtos.DemandRequest'
        maxItems: 50
        type: array
    type: object
  dtos.ReplacePhasesRequest:
    properties:
      phases:
        items:
          $ref: '#/definitions/dtos.PhaseRequest'
        maxItems: 20
        type: array
    type: object
  dtos.ReplaceSkillsRequest:
    properties:
      skills:
        items:
          $ref: '#/definitions/dtos.SkillRequest'
        minItems: 1
        type: array
    required:
    - skills
    type: object
  dtos.RiskProjectResponse:
    properties:
      deadline_week:
        example: 2027-W08
        type: string
      id:
        type: string
      metrics:
        $ref: '#/definitions/dtos.ProgressResponse'
      name:
        example: Records Integration
        type: string
      program:
        example: Beta Health Portal
        type: string
      program_id:
        type: string
      status:
        example: incoming
        type: string
    type: object
  dtos.RisksResponse:
    properties:
      people:
        items:
          $ref: '#/definitions/dtos.OverloadedPersonResponse'
        type: array
      projects:
        items:
          $ref: '#/definitions/dtos.RiskProjectResponse'
        type: array
    type: object
  dtos.ScenarioChangeResponse:
    properties:
      after_from:
        example: 2026-W46
        type: string
      after_hours:
        example: 80
        type: number
      after_to:
        example: 2026-W49
        type: string
      before_from:
        description: The weeks are the first and last with hours; empty when there
          are none.
        example: 2026-W44
        type: string
      before_hours:
        example: 80
        type: number
      before_to:
        example: 2026-W47
        type: string
      change:
        enum:
        - added
        - removed
        - changed
        type: string
      demand_id:
        type: string
      expertise:
        example: QA
        type: string
      moved_hours:
        description: MovedHours is the hours placed in a week beyond what that week
          had before.
        example: 40
        type: number
      person:
        $ref: '#/definitions/dtos.PersonRef'
      project:
        example: Checkout Revamp
        type: string
      project_id:
        type: string
    type: object
  dtos.ScenarioDetailResponse:
    properties:
      assumptions:
        items:
          $ref: '#/definitions/dtos.AssumptionResponse'
        type: array
      base_version:
        description: |-
          BaseVersion is the baseline version it was computed on; Stale is true once the baseline
          in force (CurrentVersion) is another one.
        example: 3
        type: integer
      changes:
        items:
          $ref: '#/definitions/dtos.ScenarioChangeResponse'
        type: array
      created_at:
        type: string
      current_version:
        example: 3
        type: integer
      id:
        type: string
      name:
        example: Checkout slips two weeks
        type: string
      projects:
        description: Projects are those planned again.
        items:
          $ref: '#/definitions/dtos.ScenarioProjectResponse'
        type: array
      stale:
        type: boolean
      summary:
        $ref: '#/definitions/dtos.ScenarioSummaryResponse'
      unmet:
        items:
          $ref: '#/definitions/dtos.ScenarioUnmetResponse'
        type: array
      updated_at:
        type: string
    type: object
  dtos.ScenarioProjectResponse:
    properties:
      id:
        type: string
      name:
        example: Checkout Revamp
        type: string
      program_id:
        type: string
    type: object
  dtos.ScenarioResponse:
    properties:
      assumptions:
        items:
          $ref: '#/definitions/dtos.AssumptionResponse'
        type: array
      base_version:
        description: |-
          BaseVersion is the baseline version it was computed on; Stale is true once the baseline
          in force (CurrentVersion) is another one.
        example: 3
        type: integer
      created_at:
        type: string
      current_version:
        example: 3
        type: integer
      id:
        type: string
      name:
        example: Checkout slips two weeks
        type: string
      stale:
        type: boolean
      summary:
        $ref: '#/definitions/dtos.ScenarioSummaryResponse'
      updated_at:
        type: string
    type: object
  dtos.ScenarioSummaryResponse:
    properties:
      hours_moved:
        description: HoursMoved is the hours placed in a week beyond what that week
          had in the baseline.
        example: 120
        type: number
      people_changed:
        example: 3
        type: integer
      unmet_hours:
        example: 40
        type: number
    type: object
  dtos.ScenarioUnmetResponse:
    properties:
      demand_id:
        type: string
      expertise:
        example: QA
        type: string
      hours:
        example: 40
        type: number
      project:
        example: Checkout Revamp
        type: string
      project_id:
        type: string
      reason:
        enum:
        - NO_SKILL
        - LEVEL_TOO_LOW
        - NO_CAPACITY_BEFORE_DEADLINE
        - BLOCKED_BY_LOCKED
        type: string
    type: object
  dtos.ScheduleAbsenceResponse:
    properties:
      hours_per_day:
        example: 8
        type: number
      id:
        type: string
      source:
        enum:
        - manual
        - calendar
        type: string
      status:
        enum:
        - planned
        - approved
        type: string
      type:
        enum:
        - leave
        - training
        type: string
    type: object
  dtos.ScheduleDayResponse:
    properties:
      absences:
        items:
          $ref: '#/definitions/dtos.ScheduleAbsenceResponse'
        type: array
      date:
        example: "2026-10-21"
        type: string
      holidays:
        items:
          $ref: '#/definitions/dtos.ScheduleHolidayResponse'
        type: array
    type: object
  dtos.ScheduleHolidayResponse:
    properties:
      id:
        type: string
    type: object
  dtos.ScheduleProjectResponse:
    properties:
      expertise:
        example: Engineer
        type: string
      hours:
        example: 20
        type: number
      program_id:
        type: string
      program_name:
        example: Acme Commerce Platform
        type: string
      project_id:
        type: string
      project_name:
        example: Checkout Revamp
        type: string
    type: object
  dtos.ScheduleResponse:
    properties:
      days:
        description: Days holds only the working days with an absence or a holiday.
        items:
          $ref: '#/definitions/dtos.ScheduleDayResponse'
        type: array
      weeks:
        items:
          $ref: '#/definitions/dtos.ScheduleWeekResponse'
        type: array
      working_weekdays:
        description: 'WorkingWeekdays are ISO day numbers: 1 is Monday, 7 is Sunday.'
        example:
        - 1
        - 2
        - 3
        - 4
        - 5
        items:
          type: integer
        type: array
    type: object
  dtos.ScheduleWeekResponse:
    properties:
      actual_hours:
        description: ActualHours is null until a timesheet import recorded hours for
          the week.
        example: 34
        type: number
      band:
        enum:
        - unavailable
        - underused
        - healthy
        - near_full
        - overloaded
        type: string
      capacity:
        example: 36
        type: number
      load:
        example: 32
        type: number
      projects:
        items:
          $ref: '#/definitions/dtos.ScheduleProjectResponse'
        type: array
      tentative:
        description: Tentative marks planned (not yet approved) absence in the week.
        type: boolean
      utilization:
        description: Utilization is load ÷ capacity; null when capacity is 0.
        example: 0.89
        type: number
      week:
        example: 2026-W42
        type: string
    type: object
  dtos.SetAllocationRequest:
    properties:
      assignment_id:
        type: string
      hours:
        example: 16
        maximum: 80
        minimum: 0
        type: number
      locked:
        description: Locked pins the week; leave it out to keep the current lock.
        type: boolean
      week:
        example: 2026-W42
        type: string
    required:
    - assignment_id
    - week
    type: object
  dtos.SkillRequest:
    properties:
      expertise_id:
        type: string
      level:
        maximum: 5
        minimum: 1
        type: integer
      primary:
        type: boolean
    required:
    - expertise_id
    type: object
  dtos.UpdatePersonRequest:
    properties:
      active:
        type: boolean
      end_date:
        example: "2027-03-31"
        type: string
      name:
        maxLength: 200
        minLength: 1
        type: string
      non_project_hours:
        maximum: 80
        minimum: 0
        type: number
      role:
        type: string
      start_date:
        example: "2026-10-12"
        type: string
      weekly_hours:
        maximum: 80
        type: number
    type: object
  dtos.UpdatePhaseRequest:
    properties:
      end_week:
        example: 2026-W49
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
      start_week:
        example: 2026-W42
        type: string
    type: object
  dtos.UpdateProgramRequest:
    properties:
      charter_url:
        type: string
      client:
        maxLength: 200
        minLength: 1
        type: string
      end_date:
        type: string
      goal:
        maxLength: 2000
        type: string
      lead_id:
        type: string
      name:
        maxLength: 200
        minLength: 1
        type: string
      objectives:
        items:
          type: string
        maxItems: 20
        type: array
      start_date:
        type: string
    required:
    - objectives
    type: object
  dtos.UpdateProjectRequest:
    properties:
      deadline:
        type: string
      done_points:
        minimum: 0
        type: number
      lead_id:
        type: string
      name:
        maxLength: 200
        minLength: 1
        type: string
      priority:
        maximum: 5
        minimum: 1
        type: integer
      scope_points:
        minimum: 0
        type: number
      start_earliest:
        type: string
    type: object
  services.RowProblem:
    properties:
      code:
        type: string
      column:
        type: string
      line:
        type: integer
    type: object
info:
  contact: {}
  description: Staffing and capacity planning API for The Slot Finder
  title: The Slot Finder API
  version: "1.0"
paths:
  /:
    get:
      consumes:
      - application/json
      description: Check if the service is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.HealthResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      summary: Health Check
      tags:
      - Health
  /absences/{id}:
    delete:
      description: A person may remove their own absences; planners anyone's and holidays.
      parameters:
      - description: Absence id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Remove an absence or a holiday
      tags:
      - Availability
  /absences/{id}/approve:
    post:
      description: Turns a person's planned absence into an approved one and records
        an AbsenceAdded change event with the new status. An approved absence or a
        holiday gets ABSENCE_NOT_PLANNED.
      parameters:
      - description: Absence id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.AbsenceResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "409":
          description: Conflict
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Approve a planned absence
      tags:
      - Availability
  /events:
    get:
      description: Changes that may break the plan (absence, slipped phases and deadlines),
        newest first, with their processing status and re-plan draft. With program_id,
        only changes that touch its projects; the program page uses it for the re-plan
        banner.
      parameters:
      - description: Program id
        in: query
        name: program_id
        type: string
      - description: Page, from 1
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/dtos.ChangeEventResponse'
                type: array
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Change history
      tags:
      - Events
  /expertises:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/dtos.ExpertiseResponse'
                type: array
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Expertise catalogue
      tags:
      - People
  /health/database:
    get:
      consumes:
      - application/json
      description: Check if the database connection is healthy
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                type: object
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      summary: Database Health Check
      tags:
      - Health
  /health/metrics:
    get:
      consumes:
      - application/json
      description: Get detailed database connection metrics
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                type: object
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      summary: Database Connection Metrics
      tags:
      - Health
  /holidays:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/dtos.AbsenceResponse'
                type: array
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Company-wide holidays
      tags:
      - Availability
    post:
      consumes:
      - application/json
      parameters:
      - description: Holiday
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateHolidayRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.AbsenceResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Add a company-wide holiday
      tags:
      - Availability
  /insights/heatmap:
    get:
      description: Person × week load, capacity, utilization band and hours per expertise
        from the baseline. Weeks default to the current week and HEATMAP_DEFAULT_WEEKS;
        a range over HEATMAP_MAX_WEEKS gets WEEK_RANGE_TOO_LONG. With expertise, keeps
        people who hold it or work on it in the range.
      parameters:
      - description: First week
        example: 2026-W42
        in: query
        name: from
        type: string
      - description: Last week
        example: 2026-W53
        in: query
        name: to
        type: string
      - description: Expertise id
        in: query
        name: expertise
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.HeatmapResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Team heatmap
      tags:
      - Insights
  /insights/risks:
    get:
      description: Open projects that are understaffed, at risk or behind on delivery,
        and people over 100 % in the next HEATMAP_DEFAULT_WEEKS weeks.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.RisksResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Risks
      tags:
      - Insights
  /me:
    get:
      description: 'The signed-in user, read from the verified access token: id, username,
        name, email and role, plus person_id. On the first sign-in the person record
        is matched by email and linked to the account.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.CurrentUserResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - Identity
  /people:
    get:
      description: People ordered by name, each with their skills (primary first).
      parameters:
      - description: Page, from 1
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/dtos.PersonResponse'
                type: array
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: List people
      tags:
      - People
    post:
      consumes:
      - application/json
      description: Creates a person with their expertise and levels. Exactly one expertise
        must be primary.
      parameters:
      - description: Person
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.CreatePersonRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.PersonResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "409":
          description: Conflict
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Create a person
      tags:
      - People
  /people/{id}:
    get:
      description: One person with their skills (primary first), for the person page.
      parameters:
      - description: Person id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.PersonResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: A person
      tags:
      - People
    patch:
