      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/dtos.PhaseResponse'
                type: array
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: A project's phases
      tags:
      - Projects
    put:
      consumes:
      - application/json
      description: The full ordered list (its order is the sequence). Phases with
        an id are updated, without one added, missing ones removed; a phase that still
        has demand cannot be removed (409).
      parameters:
      - description: Project id
        in: path
        name: id
        required: true
        type: string
      - description: Phases
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.ReplacePhasesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.ProjectDetailResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "409":
          description: Conflict
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Replace a project's phases
      tags:
      - Projects
  /scenarios:
    get:
      description: Every scenario, newest first, with its assumptions, churn and whether
        the baseline has moved on since.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/dtos.ScenarioResponse'
                type: array
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: What-if scenarios
      tags:
      - Scenarios
    post:
      consumes:
      - application/json
      description: Applies the assumptions (a project moving by weeks, a person away)
        to a copy of the baseline, plans the affected projects again and saves the
        result. Nothing else changes.
      parameters:
      - description: Name and assumptions
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateScenarioRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.ScenarioDetailResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Create a what-if scenario
      tags:
      - Scenarios
  /scenarios/{id}:
    delete:
      parameters:
      - description: Scenario id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Delete a scenario
      tags:
      - Scenarios
    get:
      description: The scenario's assumptions, the projects planned again, and its
        changes, churn and unmet demand against the baseline it was built on.
      parameters:
      - description: Scenario id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.ScenarioDetailResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: A what-if scenario
      tags:
      - Scenarios
  /scenarios/{id}/rerun:
    post:
      description: Computes the scenario again, with the same assumptions, against
        the baseline in force.
      parameters:
      - description: Scenario id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.ScenarioDetailResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Run a scenario again
      tags:
      - Scenarios
  /staffing-drafts:
    post:
      consumes:
      - application/json
      description: The planning engine staffs the projects' demand on top of the baseline.
        Only incoming, planned or active projects.
      parameters:
      - description: Projects to staff
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.GenerateDraftRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.DraftResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "409":
          description: Conflict
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Generate a staffing draft
      tags:
      - Staffing drafts
  /staffing-drafts/{id}:
    get:
      description: The draft's assignments for the covered demand, coverage and unmet
        reasons, and changes against the baseline in force.
      parameters:
      - description: Draft id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.DraftResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: A staffing draft
      tags:
      - Staffing drafts
  /staffing-drafts/{id}/accept:
    post:
      consumes:
      - application/json
      description: Publishes the draft as the new baseline, only while the baseline
        is still base_version (else 409 PLAN_VERSION_CONFLICT). Stretch assignments
        need confirm_stretch. Fully staffed incoming projects become planned.
      parameters:
      - description: Draft id
        in: path
        name: id
        required: true
        type: string
      - description: Base version
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.AcceptDraftRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.DraftResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "409":
          description: Conflict
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Accept a staffing draft
      tags:
      - Staffing drafts
  /staffing-drafts/{id}/assignments:
    patch:
      consumes:
      - application/json
      description: Add or remove assignments and change weekly hours or locks, all
        in one transaction. The server sets each added assignment's kind; a stretch
        assignment is locked.
      parameters:
      - description: Draft id
        in: path
        name: id
        required: true
        type: string
      - description: Changes
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.EditDraftRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.DraftResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "409":
          description: Conflict
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Change a staffing draft
      tags:
      - Staffing drafts
  /staffing-drafts/{id}/reject:
    post:
      parameters:
      - description: Draft id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.DraftResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "409":
          description: Conflict
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Reject a staffing draft
      tags:
      - Staffing drafts
  /timesheets/import:
    post:
      consumes:
      - multipart/form-data
      description: 'Upload a filled-in template as the multipart field "file". Every
        row is checked first: any problem saves nothing and returns 400 TIMESHEET_INVALID
        with data.problems [{line, column, code}]. A row with an empty actual_hours
        is skipped; importing again overwrites the same person, project and week.
        A file over TIMESHEET_MAX_BYTES or TIMESHEET_MAX_ROWS gets 413 TIMESHEET_TOO_LARGE.
        Records no change event.'
      parameters:
      - description: Filled-in timesheet template (CSV)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.ImportResultResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              data:
                properties:
                  problems:
                    items:
                      $ref: '#/definitions/services.RowProblem'
                    type: array
                type: object
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Import a timesheet
      tags:
      - Timesheets
  /timesheets/template:
    get:
      description: A CSV with one row per person × project × week that has baseline
        or actual hours in the range, with planned hours and any actual hours already
        recorded. Weeks default to the TIMESHEET_TEMPLATE_WEEKS up to the current
        week; a week after the current one gets TIMESHEET_WEEK_IN_FUTURE and a range
        over TIMESHEET_MAX_WEEKS gets WEEK_RANGE_TOO_LONG.
      parameters:
      - description: First week
        example: 2026-W39
        in: query
        name: from
        type: string
      - description: Last week
        example: 2026-W42
        in: query
        name: to
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Timesheet template
      tags:
      - Timesheets
schemes:
- http
- https
securityDefinitions:
  BasicAuth:
    type: basic
  BearerAuth:
    description: Bearer Token Authentication. Use "Bearer {token}" as the value.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
