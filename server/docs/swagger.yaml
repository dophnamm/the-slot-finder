  /insights/heatmap:
    get:
      description: Person × week load, capacity, utilization band and hours per expertise
        from the baseline. Weeks default to the current week and HEATMAP_DEFAULT_WEEKS;
        a range over HEATMAP_MAX_WEEKS gets WEEK_RANGE_TOO_LONG. With expertise, keeps
        people who hold it or work on it in the range. With program_id, keeps the
        people of that program's team; a manager may filter only by a program they
        may read.
      parameters:
      - description: First week
        example: 2026-W42
        in: query
        name: from
        type: string
      - description: Last week
        example: 2026-W53
        in: query
        name: to
        type: string
      - description: Expertise id
        in: query
        name: expertise
        type: string
      - description: 'Program id: only the people of its team'
