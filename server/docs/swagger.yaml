              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "429":
          description: Too Many Requests
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "502":
          description: Bad Gateway
          schema:
            properties:
              meta:
