basePath: /api/v1
definitions:
  dtos.AbsenceResponse:
    properties:
      from_date:
        example: "2026-10-19"
        type: string
      hours_per_day:
        example: 8
        type: number
      id:
        type: string
      name:
        description: Name says what a holiday is; empty for leave.
        example: National Day
        type: string
      person_id:
        type: string
      source:
        enum:
        - manual
        - calendar
        example: manual
        type: string
      status:
        example: approved
        type: string
      to_date:
        example: "2026-10-23"
        type: string
      type:
        example: leave
        type: string
    type: object
  dtos.AcceptDraftRequest:
    properties:
      base_version:
        description: BaseVersion is the draft's base_version; a different baseline
          in force gives 409.
        minimum: 0
        type: integer
      confirm_stretch:
        description: ConfirmStretch must be true when the draft has stretch assignments.
        type: boolean
    required:
    - base_version
    type: object
  dtos.AddAssignmentRequest:
    properties:
      allocations:
        items:
          $ref: '#/definitions/dtos.DraftWeekHours'
        maxItems: 104
        type: array
      demand_id:
        type: string
      person_id:
        type: string
    required:
    - demand_id
    - person_id
    type: object
  dtos.AddTeamMemberRequest:
    properties:
      person_id:
        example: 0192f3a4-0000-7000-8000-0000000000b1
        type: string
    required:
    - person_id
    type: object
  dtos.AllocationResponse:
    properties:
      hours:
        example: 16
        type: number
      locked:
        type: boolean
      week:
        example: 2026-W42
        type: string
    type: object
  dtos.AlternativeResponse:
    properties:
      capacity_hours:
        example: 120
        type: number
      free_hours:
        description: FreeHours is the person's capacity minus the plan's hours over
          the demand's window.
        example: 48
        type: number
      kind:
        enum:
        - primary
        - cross_expertise
        type: string
      person:
        $ref: '#/definitions/dtos.PersonRef'
      reason:
        description: Reason says why their skill fits the demand, as a proposal words
          it.
        items:
          type: string
        type: array
    type: object
  dtos.AskAIRequest:
    properties:
      page_context:
        example: Project page, id 0b8c5a52-3c0d-4c7e-9a43-6f8a1f0f0001
        maxLength: 200
        type: string
      question:
        example: Who is overloaded next week?
        maxLength: 500
        minLength: 1
        type: string
    required:
    - question
    type: object
  dtos.AskAIResponse:
    properties:
      answer:
        type: string
    type: object
  dtos.AssignmentDemandResponse:
    properties:
      expertise:
        example: QA
        type: string
      from_week:
        example: 2026-W48
        type: string
      headcount:
        example: 1
        type: integer
      hours:
        example: 120
        type: number
      id:
        type: string
      min_level:
        example: 3
        type: integer
      phase:
        example: Test
        type: string
      program:
        example: Acme Commerce Platform
        type: string
      program_id:
        type: string
      project:
        example: Checkout Revamp
        type: string
      project_id:
        type: string
      to_week:
        example: 2026-W50
        type: string
    type: object
  dtos.AssignmentResponse:
    properties:
      allocations:
        items:
          $ref: '#/definitions/dtos.AllocationResponse'
        type: array
      by_hand:
        description: ByHand is true when a Planner added the assignment; false when
          the engine proposed it.
        type: boolean
      demand:
        $ref: '#/definitions/dtos.AssignmentDemandResponse'
      id:
        type: string
      kind:
        enum:
        - primary
        - cross_expertise
        - stretch
        type: string
      person:
        $ref: '#/definitions/dtos.PersonRef'
      reason:
        items:
          type: string
        type: array
      total_hours:
        example: 120
        type: number
    type: object
  dtos.AssumptionRequest:
    properties:
      from_date:
        example: "2026-10-26"
        type: string
      hours_per_day:
        example: 8
        maximum: 24
        type: number
      person_id:
        type: string
      project_id:
        type: string
      to_date:
        example: "2026-11-06"
        type: string
      type:
        enum:
        - shift_project
        - add_absence
        type: string
      weeks:
        example: 2
        type: integer
    required:
    - type
    type: object
  dtos.AssumptionResponse:
    properties:
      from_date:
        example: "2026-10-26"
        type: string
      hours_per_day:
        example: 8
        type: number
      person:
        example: Alex Nguyen
        type: string
      person_id:
        type: string
      project:
        example: Checkout Revamp
        type: string
      project_id:
        type: string
      to_date:
        example: "2026-11-06"
        type: string
      type:
        enum:
        - shift_project
        - add_absence
        type: string
      weeks:
        example: 2
        type: integer
    type: object
  dtos.CalendarFeedResponse:
    properties:
      events_found:
        example: 2
        type: integer
      host:
        example: calendar.google.com
        type: string
      last_error:
        example: CALENDAR_FEED_UNREACHABLE
        type: string
      last_synced_at:
        type: string
    type: object
  dtos.CapacityForecastResponse:
    properties:
      expertises:
        items:
          $ref: '#/definitions/dtos.ExpertiseForecastResponse'
        type: array
      weeks:
        example:
        - 2026-W42
        - 2026-W43
        items:
          type: string
        type: array
    type: object
  dtos.ChangeEventResponse:
    properties:
      attempts:
        type: integer
      draft:
        $ref: '#/definitions/dtos.EventDraftResponse'
      id:
        type: string
      last_error:
        type: string
      occurred_at:
        type: string
      payload:
        additionalProperties: {}
        description: Payload depends on the type, e.g. person_name, from_date and
          to_date for absence.
        type: object
      project_ids:
        items:
          type: string
        type: array
      status:
        enum:
        - pending
        - no_impact
        - draft_created
        - failed
        type: string
      type:
        enum:
        - AbsenceAdded
        - AbsenceRemoved
        - PhaseSlipped
        - ProjectSlipped
        - ProjectStatusChanged
        - DemandChanged
        - PersonCapacityChanged
        - TeamChanged
        - SkillChanged
        - ProgramSlipped
        type: string
    type: object
  dtos.ConnectCalendarFeedRequest:
    properties:
      url:
        example: https://calendar.google.com/calendar/ical/name%40example.com/private-abc/basic.ics
        maxLength: 2048
        type: string
    required:
    - url
    type: object
  dtos.CreateAbsenceRequest:
    properties:
      from_date:
        example: "2026-10-19"
        type: string
      hours_per_day:
        example: 8
        maximum: 24
        type: number
      status:
        enum:
        - planned
        - approved
        type: string
      to_date:
        example: "2026-10-23"
        type: string
      type:
        enum:
        - leave
        - training
        type: string
    required:
    - from_date
    - to_date
    - type
    type: object
  dtos.CreateHolidayRequest:
    properties:
      from_date:
        example: "2026-12-24"
        type: string
      hours_per_day:
        example: 8
        maximum: 24
        type: number
      name:
        example: Christmas Day
        maxLength: 100
        type: string
      to_date:
        example: "2026-12-25"
        type: string
    required:
    - from_date
    - to_date
    type: object
  dtos.CreatePersonRequest:
    properties:
      email:
        maxLength: 320
        type: string
      end_date:
        type: string
      name:
        maxLength: 200
        type: string
      non_project_hours:
        maximum: 80
        minimum: 0
        type: number
      role:
        type: string
      skills:
        items:
          $ref: '#/definitions/dtos.SkillRequest'
        minItems: 1
        type: array
      start_date:
        type: string
      weekly_hours:
        maximum: 80
        type: number
    required:
    - email
    - name
    - role
    - skills
    type: object
  dtos.CreateProgramRequest:
    properties:
      charter_url:
        maxLength: 2000
        type: string
      client:
        maxLength: 200
        type: string
      end_date:
        example: "2026-12-18"
        type: string
      goal:
        maxLength: 2000
        type: string
      lead_id:
        type: string
      name:
        maxLength: 200
        type: string
      objectives:
        items:
          type: string
        maxItems: 20
        type: array
      start_date:
        example: "2026-09-28"
        type: string
    required:
    - client
    - end_date
    - name
    - objectives
    - start_date
    type: object
  dtos.CreateProjectRequest:
    properties:
      deadline:
        example: "2026-12-18"
        type: string
      done_points:
        minimum: 0
        type: number
      lead_id:
        type: string
      name:
        maxLength: 200
        type: string
      priority:
        example: 2
        minimum: 1
        type: integer
      scope_points:
        minimum: 0
        type: number
      start_earliest:
        example: "2026-10-12"
        type: string
    required:
    - deadline
    - name
    - start_earliest
    type: object
  dtos.CreateScenarioRequest:
    properties:
      assumptions:
        items:
          $ref: '#/definitions/dtos.AssumptionRequest'
        minItems: 1
        type: array
      name:
        example: Checkout slips two weeks
        maxLength: 120
        type: string
    required:
    - assumptions
    - name
    type: object
  dtos.CurrentUserResponse:
    properties:
      email:
        example: planner@slot-finder.local
        type: string
      id:
        example: 5b0c2b7e-4c1e-4a43-9b8e-0b1f2f6f8a10
        type: string
      name:
        example: Pat Planner
        type: string
      person_id:
        description: PersonID is the user's person record, or null when the account
          has none.
        example: 0192f3a4-0000-7000-8000-0000000000aa
        type: string
      role:
        enum:
        - planner
        - manager
        - specialist
        example: planner
        type: string
      username:
        example: planner
        type: string
    type: object
  dtos.DemandRequest:
    properties:
      expertise_id:
        type: string
      headcount:
        example: 1
        maximum: 20
        minimum: 1
        type: integer
      id:
        type: string
      min_level:
        example: 3
        maximum: 5
        minimum: 1
        type: integer
      phase_id:
        type: string
      profile:
        enum:
        - flat
        type: string
      total_hours:
        example: 120
        maximum: 100000
        type: number
    required:
    - expertise_id
    type: object
  dtos.DemandResponse:
    properties:
      expertise:
        example: QA
        type: string
      expertise_id:
        type: string
      from_week:
        example: 2026-W46
        type: string
      headcount:
        example: 1
        type: integer
      id:
        type: string
      min_level:
        example: 3
        type: integer
      phase_id:
        type: string
      profile:
        example: flat
        type: string
      to_week:
        example: 2026-W51
        type: string
      total_hours:
        example: 120
        type: number
    type: object
  dtos.DraftBandsResponse:
    properties:
      near_full_from:
        description: 'NearFullFrom: from this share up to 100 % the week is near full;
          over 100 % it is overloaded.'
        example: 0.85
        type: number
      underused_below:
        description: 'UnderusedBelow: under this share of capacity the week is underused.'
        example: 0.5
        type: number
    type: object
  dtos.DraftDemandResponse:
    properties:
      assigned_hours:
        example: 80
        type: number
      expertise:
        example: QA
        type: string
      from_week:
        example: 2026-W48
        type: string
      headcount:
        example: 1
        type: integer
      hours:
        example: 100
        type: number
      id:
        type: string
      min_level:
        example: 3
        type: integer
      phase:
        example: Test
        type: string
      project:
        example: Checkout Revamp
        type: string
      project_id:
        type: string
      team_ids:
        description: TeamIDs are the people of the program team who may staff the
          demand; null puts no limit.
        items:
          type: string
        type: array
      to_week:
        example: 2026-W50
        type: string
      unmet_reason:
        description: UnmetReason is the engine's code for hours it could not place
          when it made the draft.
        enum:
        - NO_SKILL
        - LEVEL_TOO_LOW
        - NO_CAPACITY_BEFORE_DEADLINE
        - BLOCKED_BY_LOCKED
        - BLOCKED_BY_EXPERTISE_LIMIT
        - BELOW_MIN_HOURS
        - NO_ONE_IN_TEAM
        type: string
    type: object
  dtos.DraftProjectResponse:
    properties:
      deadline_week:
        example: 2026-W50
        type: string
      id:
        type: string
      name:
        example: Checkout Revamp
        type: string
      priority:
        example: 1
        type: integer
      program:
        example: Acme Commerce Platform
        type: string
      program_id:
        type: string
      program_lead_id:
        description: ProgramLeadID is the person who manages the program; they may
          act on a draft of its projects.
        type: string
      staffed_at:
        type: string
      status:
        example: incoming
        type: string
    type: object
  dtos.DraftResponse:
    properties:
      assignments:
        description: Assignments are those of the covered demand; the rest of the
          baseline is unchanged.
        items:
          $ref: '#/definitions/dtos.AssignmentResponse'
        type: array
      auto:
        description: Auto is true for a re-plan draft that change events created;
          TriggeredBy lists them.
        type: boolean
      bands:
        allOf:
        - $ref: '#/definitions/dtos.DraftBandsResponse'
        description: |-
          Bands are the limits for colouring a week; the client adds the hours of the cell it edits to
          OtherHours of the person's weeks in Load.
      base_version:
        description: BaseVersion is the baseline version the draft was built on; send
          it back to accept.
        example: 3
        type: integer
      changes:
        items:
          $ref: '#/definitions/dtos.PlanChangeResponse'
        type: array
      created_at:
        type: string
      current_version:
        description: CurrentVersion is the baseline in force now. Stale is true when
          they differ.
        example: 3
        type: integer
      demands:
        items:
          $ref: '#/definitions/dtos.DraftDemandResponse'
        type: array
      has_stretch:
        type: boolean
      id:
        type: string
      load:
        description: Load lists every active person's capacity and other hours for
          each week the draft spans.
        items:
          $ref: '#/definitions/dtos.DraftWeekLoadResponse'
        type: array
      projects:
        items:
          $ref: '#/definitions/dtos.DraftProjectResponse'
        type: array
      published_at:
        type: string
      stale:
        type: boolean
      status:
        enum:
        - draft
        - published
        - rejected
        - superseded
        type: string
      superseded_by:
        description: SupersededBy is the newer version of a re-plan draft that replaced
          this one.
        type: string
      triggered_by:
        items:
          $ref: '#/definitions/dtos.ChangeEventResponse'
        type: array
      weeks:
        example:
        - 2026-W42
        - 2026-W43
        items:
          type: string
        type: array
    type: object
  dtos.DraftWeekHours:
    properties:
      hours:
        example: 16
        maximum: 80
        minimum: 0
        type: number
      week:
        example: 2026-W42
        type: string
    required:
    - week
    type: object
  dtos.DraftWeekLoadResponse:
    properties:
      capacity:
        description: Capacity is the person's bookable hours that week.
        example: 32
        type: number
      other_hours:
        description: OtherHours are the hours the plan gives the person on demand
          this draft does not cover.
        example: 8
        type: number
      person_id:
        type: string
      week:
        example: 2026-W48
        type: string
    type: object
  dtos.EditDraftRequest:
    properties:
      add:
        items:
          $ref: '#/definitions/dtos.AddAssignmentRequest'
        maxItems: 50
        type: array
      remove:
        items:
          type: string
        maxItems: 200
        type: array
      set:
        items:
          $ref: '#/definitions/dtos.SetAllocationRequest'
        maxItems: 500
        type: array
    type: object
  dtos.EventDraftResponse:
    properties:
      id:
        type: string
      status:
        enum:
        - draft
        - published
        - rejected
        - superseded
        type: string
    type: object
  dtos.ExpertiseForecastResponse:
    properties:
      expertise:
        example: QA
        type: string
      expertise_id:
        type: string
      sustained_overload:
        allOf:
        - $ref: '#/definitions/dtos.OverloadRunResponse'
        description: SustainedOverload is the first run of overloaded weeks long enough
          to warn about; null when there is none.
      weeks:
        items:
          $ref: '#/definitions/dtos.ForecastWeekResponse'
        type: array
    type: object
  dtos.ExpertiseHoursResponse:
    properties:
      expertise:
        example: QA
        type: string
      expertise_id:
        type: string
      hours:
        example: 8
        type: number
      primary:
        description: Primary is true when it is the person's primary skill.
        type: boolean
    type: object
  dtos.ExpertiseResponse:
    properties:
      id:
        type: string
      name:
        example: QA
        type: string
    type: object
  dtos.ExpertiseStaffingResponse:
    properties:
      budget_hours:
        example: 160
        type: number
      expertise:
        example: QA
        type: string
      expertise_id:
        type: string
      gap_hours:
        example: 40
        type: number
      planned_hours:
        example: 120
        type: number
      staffing_percent:
        example: 75
        type: number
      understaffed:
        type: boolean
    type: object
  dtos.ForecastPersonResponse:
    properties:
      band:
        enum:
        - unavailable
        - underused
        - healthy
        - near_full
        - overloaded
        type: string
      capacity:
        example: 36
        type: number
      free_hours:
        description: FreeHours is capacity − load, never below 0.
        example: 4
        type: number
      load:
        example: 32
        type: number
      name:
        example: Erin
        type: string
      overloaded:
        type: boolean
      person_id:
        type: string
      utilization:
        description: Utilization is load ÷ capacity; null when capacity is 0.
        example: 0.89
        type: number
    type: object
  dtos.ForecastWeekResponse:
    properties:
      capacity:
        example: 72
        type: number
      free_hours:
        description: FreeHours is capacity − load per person, never below 0.
        example: 12
        type: number
      load:
        example: 60
        type: number
      overloaded:
        type: boolean
      people:
        description: People are the expertise's people in the week, highest load first;
          those with no capacity and no load are left out.
        items:
          $ref: '#/definitions/dtos.ForecastPersonResponse'
        type: array
      pipeline_hours:
        description: PipelineHours is the demand of incoming projects × the pipeline
          confidence.
        example: 10
        type: number
      shortfall_hours:
        description: ShortfallHours is unmet plus pipeline hours that free capacity
          cannot take.
        example: 6
        type: number
      unmet_hours:
        description: UnmetHours is confirmed demand the baseline does not cover.
        example: 8
        type: number
      week:
        example: 2026-W42
        type: string
    type: object
  dtos.GenerateDraftRequest:
    properties:
      project_ids:
        items:
          type: string
        maxItems: 20
        minItems: 1
        type: array
    required:
    - project_ids
    type: object
  dtos.HealthResponse:
    properties:
      service:
        example: slot-finder
        type: string
      status:
        example: healthy
        type: string
      timestamp:
        example: "2021-01-01T00:00:00Z"
        type: string
      version:
        example: 1.0.0
        type: string
    type: object
  dtos.HeatmapCellResponse:
    properties:
      actual_hours:
        description: |-
          ActualHours is what the person worked that week from imported timesheets; null when
          nothing was imported. Load, utilization and band stay planned.
        example: 30
        type: number
      band:
        enum:
        - unavailable
        - underused
        - healthy
        - near_full
        - overloaded
        type: string
      by_expertise:
        items:
          $ref: '#/definitions/dtos.ExpertiseHoursResponse'
        type: array
      capacity:
        example: 36
        type: number
      load:
        example: 32
        type: number
      tentative:
        description: Tentative marks planned (not yet approved) absence in the week.
        type: boolean
      utilization:
        description: Utilization is load ÷ capacity; null when capacity is 0.
        example: 0.89
        type: number
      week:
        example: 2026-W42
        type: string
    type: object
  dtos.HeatmapResponse:
    properties:
      rows:
        items:
          $ref: '#/definitions/dtos.HeatmapRowResponse'
        type: array
      weeks:
        example:
        - 2026-W42
        - 2026-W43
        items:
          type: string
        type: array
    type: object
  dtos.HeatmapRowResponse:
    properties:
      cells:
        items:
          $ref: '#/definitions/dtos.HeatmapCellResponse'
        type: array
      person:
        $ref: '#/definitions/dtos.PersonRef'
      primary_expertise:
        example: Engineer
        type: string
      primary_expertise_id:
        type: string
      sustained_overload:
        allOf:
        - $ref: '#/definitions/dtos.OverloadRunResponse'
        description: |-
          SustainedOverload is the first run of overloaded weeks in the range, long enough to
          warn about; null when there is none.
    type: object
  dtos.HolidayImportResponse:
    properties:
      added:
        example: 11
        type: integer
      skipped:
        example: 2
        type: integer
    type: object
  dtos.ImportResultResponse:
    properties:
      created:
        example: 12
        type: integer
      skipped:
        example: 5
        type: integer
      updated:
        example: 3
        type: integer
    type: object
  dtos.MemberExpertiseResponse:
    properties:
      expertise:
        example: Engineer
        type: string
      expertise_id:
        type: string
      hours:
        example: 120
        type: number
      kind:
        enum:
        - primary
        - cross_expertise
        - stretch
        example: primary
        type: string
    type: object
  dtos.Meta:
    description: Metadata for pagination
    properties:
      code:
        example: 400
        type: integer
      error_code:
        example: BAD_REQUEST
        type: string
      message:
        example: Request is invalid
        type: string
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 18
        type: integer
    type: object
  dtos.OpenDraftResponse:
    properties:
      auto:
        description: Auto is true for a re-plan draft that change events created.
        type: boolean
      base_version:
        description: BaseVersion is the baseline version the draft was built on; Stale
          is true when the baseline in force differs.
        example: 3
        type: integer
      created_at:
        type: string
      current_version:
        example: 3
        type: integer
      id:
