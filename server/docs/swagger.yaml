basePath: /api/v1
definitions:
  dtos.CurrentUserResponse:
    properties:
      email:
        example: planner@slot-finder.local
        type: string
      id:
        example: 5b0c2b7e-4c1e-4a43-9b8e-0b1f2f6f8a10
        type: string
      name:
        example: Pat Planner
        type: string
      role:
        enum:
        - planner
        - lead
        - specialist
        example: planner
        type: string
      username:
        example: planner
        type: string
    type: object
  dtos.HealthResponse:
    properties:
      service:
        example: slot-finder
        type: string
      status:
        example: healthy
        type: string
      timestamp:
        example: "2021-01-01T00:00:00Z"
        type: string
      version:
        example: 1.0.0
        type: string
    type: object
  dtos.Meta:
    description: Metadata for pagination
    properties:
      code:
        example: 400
        type: integer
      error_code:
        example: BAD_REQUEST
        type: string
      message:
        example: Request is invalid
        type: string
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 18
        type: integer
    type: object
info:
  contact: {}
  description: Staffing and capacity planning API for The Slot Finder
  title: The Slot Finder API
  version: "1.0"
paths:
  /:
    get:
      consumes:
      - application/json
      description: Check if the service is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.HealthResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      summary: Health Check
      tags:
      - Health
  /health/database:
    get:
      consumes:
      - application/json
      description: Check if the database connection is healthy
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                type: object
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      summary: Database Health Check
      tags:
      - Health
  /health/metrics:
    get:
      consumes:
      - application/json
      description: Get detailed database connection metrics
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                type: object
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      summary: Database Connection Metrics
      tags:
      - Health
  /me:
    get:
      description: 'The signed-in user, read from the verified access token: id, username,
        name, email and role.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.CurrentUserResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - Identity
schemes:
- http
- https
securityDefinitions:
  BasicAuth:
    type: basic
  BearerAuth:
    description: Bearer Token Authentication. Use "Bearer {token}" as the value.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
