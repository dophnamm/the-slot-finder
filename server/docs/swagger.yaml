  /staffing-drafts:
    post:
      consumes:
      - application/json
      description: The planning engine staffs the projects' demand on top of the baseline.
        Only incoming, planned or active projects.
      parameters:
      - description: Projects to staff
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.GenerateDraftRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.DraftResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "409":
          description: Conflict
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "429":
          description: Too Many Requests
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.RateLimitResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
