basePath: /api/v1
definitions:
  dtos.AbsenceResponse:
    properties:
      from_date:
        example: "2026-10-19"
        type: string
      hours_per_day:
        example: 8
        type: number
      id:
        type: string
      person_id:
        type: string
      status:
        example: approved
        type: string
      to_date:
        example: "2026-10-23"
        type: string
      type:
        example: leave
        type: string
    type: object
  dtos.CreateAbsenceRequest:
    properties:
      from_date:
        example: "2026-10-19"
        type: string
      hours_per_day:
        example: 8
        maximum: 24
        type: number
      status:
        enum:
        - planned
        - approved
        type: string
      to_date:
        example: "2026-10-23"
        type: string
      type:
        enum:
        - leave
        - training
        type: string
    required:
    - from_date
    - to_date
    - type
    type: object
  dtos.CreateHolidayRequest:
    properties:
      from_date:
        example: "2026-12-24"
        type: string
      hours_per_day:
        example: 8
        maximum: 24
        type: number
      to_date:
        example: "2026-12-25"
        type: string
    required:
    - from_date
    - to_date
    type: object
  dtos.CreatePersonRequest:
    properties:
      email:
        maxLength: 320
        type: string
      end_date:
        type: string
      name:
        maxLength: 200
        type: string
      non_project_hours:
        maximum: 80
        minimum: 0
        type: number
      role:
        type: string
      skills:
        items:
          $ref: '#/definitions/dtos.SkillRequest'
        minItems: 1
        type: array
      start_date:
        type: string
      weekly_hours:
        maximum: 80
        type: number
    required:
    - email
    - name
    - role
    - skills
    type: object
  dtos.CreateProgramRequest:
    properties:
      charter_url:
        maxLength: 2000
        type: string
      client:
        maxLength: 200
        type: string
      end_date:
        example: "2026-12-18"
        type: string
      goal:
        maxLength: 2000
        type: string
      lead_id:
        type: string
      name:
        maxLength: 200
        type: string
      objectives:
        items:
          type: string
        maxItems: 20
        type: array
      start_date:
        example: "2026-09-28"
        type: string
    required:
    - client
    - end_date
    - name
    - objectives
    - start_date
    type: object
  dtos.CurrentUserResponse:
    properties:
      email:
        example: planner@slot-finder.local
        type: string
      id:
        example: 5b0c2b7e-4c1e-4a43-9b8e-0b1f2f6f8a10
        type: string
      name:
        example: Pat Planner
        type: string
      person_id:
        description: PersonID is the user's person record, or null when the account
          has none.
        example: 0192f3a4-0000-7000-8000-0000000000aa
        type: string
      role:
        enum:
        - planner
        - lead
        - specialist
        example: planner
        type: string
      username:
        example: planner
        type: string
    type: object
  dtos.ExpertiseResponse:
    properties:
      id:
        type: string
      name:
        example: QA
        type: string
    type: object
  dtos.HealthResponse:
    properties:
      service:
        example: slot-finder
        type: string
      status:
        example: healthy
        type: string
      timestamp:
        example: "2021-01-01T00:00:00Z"
        type: string
      version:
        example: 1.0.0
        type: string
    type: object
  dtos.Meta:
    description: Metadata for pagination
    properties:
      code:
        example: 400
        type: integer
      error_code:
        example: BAD_REQUEST
        type: string
      message:
        example: Request is invalid
        type: string
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 18
        type: integer
    type: object
  dtos.PersonRef:
    properties:
      id:
        type: string
      name:
        example: Lee Lead
        type: string
    type: object
  dtos.PersonResponse:
    properties:
      active:
        type: boolean
      email:
        example: alex@slot-finder.local
        type: string
      end_date:
        type: string
      id:
        type: string
      name:
        example: Alex Nguyen
        type: string
      non_project_hours:
        example: 4
        type: number
      role:
        example: specialist
        type: string
      skills:
        items:
          $ref: '#/definitions/dtos.PersonSkillResponse'
        type: array
      start_date:
        example: "2026-01-05"
        type: string
      weekly_hours:
        example: 40
        type: number
    type: object
  dtos.PersonSkillResponse:
    properties:
      expertise:
        example: Engineer
        type: string
      expertise_id:
        type: string
      level:
        example: 4
        type: integer
      primary:
        type: boolean
    type: object
  dtos.ProgramResponse:
    properties:
      charter_url:
        type: string
      client:
        example: Acme
        type: string
      end_date:
        example: "2026-12-18"
        type: string
      end_week:
        example: 2026-W51
        type: string
      goal:
        type: string
      id:
        type: string
      lead:
        $ref: '#/definitions/dtos.PersonRef'
      name:
        example: Acme onboarding
        type: string
      objectives:
        items:
          type: string
        type: array
      start_date:
        example: "2026-09-28"
        type: string
      start_week:
        example: 2026-W40
        type: string
      status:
        enum:
        - open
        - pending
        - closing
        - closed
        - cancelled
        example: open
        type: string
    type: object
  dtos.ReplaceSkillsRequest:
    properties:
      skills:
        items:
          $ref: '#/definitions/dtos.SkillRequest'
        minItems: 1
        type: array
    required:
    - skills
    type: object
  dtos.SkillRequest:
    properties:
      expertise_id:
        type: string
      level:
        maximum: 5
        minimum: 1
        type: integer
      primary:
        type: boolean
    required:
    - expertise_id
    type: object
  dtos.UpdatePersonRequest:
    properties:
      active:
        type: boolean
      end_date:
        example: "2027-03-31"
        type: string
      name:
        maxLength: 200
        minLength: 1
        type: string
      non_project_hours:
        maximum: 80
        minimum: 0
        type: number
      role:
        type: string
      start_date:
        example: "2026-10-12"
        type: string
      weekly_hours:
        maximum: 80
        type: number
    type: object
  dtos.UpdateProgramRequest:
    properties:
      charter_url:
        type: string
      client:
        maxLength: 200
        minLength: 1
        type: string
      end_date:
        type: string
      goal:
        maxLength: 2000
        type: string
      lead_id:
        type: string
      name:
        maxLength: 200
        minLength: 1
        type: string
      objectives:
        items:
          type: string
        maxItems: 20
        type: array
      start_date:
        type: string
    required:
    - objectives
    type: object
info:
  contact: {}
  description: Staffing and capacity planning API for The Slot Finder
  title: The Slot Finder API
  version: "1.0"
paths:
  /:
    get:
      consumes:
      - application/json
      description: Check if the service is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.HealthResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      summary: Health Check
      tags:
      - Health
  /absences/{id}:
    delete:
      description: A person may remove their own absences; planners anyone's and holidays.
      parameters:
      - description: Absence id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Remove an absence or a holiday
      tags:
      - Availability
  /expertises:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/dtos.ExpertiseResponse'
                type: array
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Expertise catalogue
      tags:
      - People
  /health/database:
    get:
      consumes:
      - application/json
      description: Check if the database connection is healthy
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                type: object
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      summary: Database Health Check
      tags:
      - Health
  /health/metrics:
    get:
      consumes:
      - application/json
      description: Get detailed database connection metrics
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                type: object
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      summary: Database Connection Metrics
      tags:
      - Health
  /holidays:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/dtos.AbsenceResponse'
                type: array
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Company-wide holidays
      tags:
      - Availability
    post:
      consumes:
      - application/json
      parameters:
      - description: Holiday
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateHolidayRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.AbsenceResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Add a company-wide holiday
      tags:
      - Availability
  /me:
    get:
      description: 'The signed-in user, read from the verified access token: id, username,
        name, email and role, plus person_id. On the first sign-in the person record
        is matched by email and linked to the account.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.CurrentUserResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - Identity
  /people:
    get:
      description: People ordered by name, each with their skills (primary first).
      parameters:
      - description: Page, from 1
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/dtos.PersonResponse'
                type: array
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: List people
      tags:
      - People
    post:
      consumes:
      - application/json
      description: Creates a person with their skills. Exactly one skill must be primary.
      parameters:
      - description: Person
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.CreatePersonRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.PersonResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "409":
          description: Conflict
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Create a person
      tags:
      - People
  /people/{id}:
    patch:
      consumes:
      - application/json
      description: Changes only the fields sent. start_date and end_date accept null
        to clear them.
      parameters:
      - description: Person id
        in: path
        name: id
        required: true
        type: string
      - description: Changed fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.UpdatePersonRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.PersonResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Edit a person
      tags:
      - People
  /people/{id}/absences:
    get:
      description: Leave and training of one person, oldest first. A person may read
        their own; planners anyone's.
      parameters:
      - description: Person id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/dtos.AbsenceResponse'
                type: array
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: A person's absences
      tags:
      - Availability
    post:
      consumes:
      - application/json
      description: Adds leave or training for a person (dates inclusive). A person
        may add their own, always as planned; planners may add anyone's and choose
        the status.
      parameters:
      - description: Person id
        in: path
        name: id
        required: true
        type: string
      - description: Absence
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateAbsenceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.AbsenceResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Report an absence
      tags:
      - Availability
  /people/{id}/skills:
    put:
      consumes:
      - application/json
      description: Replaces the whole list. Exactly one skill must be primary; each
        expertise appears once.
      parameters:
      - description: Person id
        in: path
        name: id
        required: true
        type: string
      - description: Skills
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.ReplaceSkillsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.PersonResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Replace a person's skills
      tags:
      - People
  /programs:
    get:
      parameters:
      - description: Page, from 1
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/dtos.ProgramResponse'
                type: array
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: List programs
      tags:
      - Programs
    post:
      consumes:
      - application/json
      description: Planners may set lead_id; a lead who creates a program becomes
        its lead.
      parameters:
      - description: Program
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateProgramRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.ProgramResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Create a program
      tags:
      - Programs
  /programs/{id}:
    get:
      parameters:
      - description: Program id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.ProgramResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Get a program
      tags:
      - Programs
    patch:
      consumes:
      - application/json
      description: 'Only the fields sent change. charter_url and lead_id accept null;
        only planners change the lead. status is rejected: use an action.'
      parameters:
      - description: Program id
        in: path
        name: id
        required: true
        type: string
      - description: Changed fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.UpdateProgramRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.ProgramResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Edit a program
      tags:
      - Programs
  /programs/{id}/actions/{action}:
    post:
      description: hold (open → pending), resume (pending → open), start-closing (open
        → closing), close (closing → closed), cancel (open, pending or closing → cancelled;
        also cancels its open projects).
      parameters:
      - description: Program id
        in: path
        name: id
        required: true
        type: string
      - description: Action
        enum:
        - hold
        - resume
        - start-closing
        - close
        - cancel
        in: path
        name: action
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/dtos.ProgramResponse'
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
        "409":
          description: Conflict
          schema:
            properties:
              meta:
                $ref: '#/definitions/dtos.Meta'
            type: object
      security:
      - BearerAuth: []
      summary: Change a program's status
      tags:
      - Programs
schemes:
- http
- https
securityDefinitions:
  BasicAuth:
    type: basic
  BearerAuth:
    description: Bearer Token Authentication. Use "Bearer {token}" as the value.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
