root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  # Runs from cmd/server so its .env is loaded, like `go run` did.
  full_bin = "cd cmd/server && ../../tmp/server"
  include_ext = ["go"]
  exclude_dir = ["tmp", "docs", "cmd/migrations", "deploy"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
